<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smistino</title>
  <meta name="description" content="Smistino: tutte le tue email e i messaggi di WhatsApp, Telegram, SMS e altre app in un posto solo, già smistati per sezione.">
  <meta name="theme-color" content="#5b4fe0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/aggiornamenti.js" data-version="1.1.0"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Smistino, home">
      <img src="icons/logo.svg" alt="" width="38" height="38">
      <span>Smistino</span>
    </a>
    <div class="top-actions">
      <span data-update-slot></span>
      <span data-ponte-slot></span>
      <button class="iconbtn" data-act="incolla" aria-label="Aggiungi messaggio"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sezioni">
    <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Home</span></a>
    <a href="#/posta" data-tab="posta"><svg viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6z"/></svg><span>Posta</span><b class="dot" id="navBadge" hidden></b></a>
    <a href="#/sezioni" data-tab="sezioni"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span>Sezioni</span></a>
    <a href="#/scadenze" data-tab="scadenze"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>In arrivo</span></a>
    <a href="#/altro" data-tab="altro"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Altro</span></a>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>
  <div id="bannerRoot"></div>

  <script src="js/classificatore.js"></script>
  <script src="js/importa.js"></script>
  <script src="js/esempi.js"></script>
  <script src="js/ponte.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
